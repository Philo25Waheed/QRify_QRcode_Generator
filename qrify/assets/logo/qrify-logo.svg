<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="qrify-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#qrify-grad)" filter="url(#glow)" />
  <rect x="8.5" y="8.5" width="103" height="103" rx="27.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />
  
  <!-- QR Finder Patterns -->
  <!-- Top Left -->
  <rect x="26" y="26" width="28" height="28" rx="7" fill="white" />
  <rect x="32" y="32" width="16" height="16" rx="4" fill="#4f46e5" />
  <rect x="36" y="36" width="8" height="8" rx="2" fill="white" />
  
  <!-- Top Right -->
  <rect x="66" y="26" width="28" height="28" rx="7" fill="white" />
  <rect x="72" y="32" width="16" height="16" rx="4" fill="#4f46e5" />
  <rect x="76" y="36" width="8" height="8" rx="2" fill="white" />
  
  <!-- Bottom Left -->
  <rect x="26" y="66" width="28" height="28" rx="7" fill="white" />
  <rect x="32" y="72" width="16" height="16" rx="4" fill="#4f46e5" />
  <rect x="36" y="76" width="8" height="8" rx="2" fill="white" />
  
  <!-- Data modules & decorative elements -->
  <rect x="66" y="66" width="11" height="11" rx="3" fill="white" opacity="0.95" />
  <rect x="83" y="66" width="11" height="11" rx="3" fill="white" opacity="0.95" />
  <rect x="66" y="83" width="11" height="11" rx="3" fill="white" opacity="0.95" />
  <rect x="83" y="83" width="11" height="11" rx="3" fill="white" opacity="0.95" />
  
  <!-- Center decorative spark -->
  <path d="M60 48 L62 56 L70 58 L62 60 L60 68 L58 60 L50 58 L58 56 Z" fill="url(#spark-grad)" opacity="0.9" />
</svg>
